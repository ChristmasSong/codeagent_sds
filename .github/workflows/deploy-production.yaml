name: Deploy Cloudflare Production

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed D1 migrations
        env:
          DATABASE_PROVIDER: d1
        run: |
          pnpm db:setup
          pnpm db:generate
          if [ -n "$(git status --porcelain --untracked-files=all -- drizzle)" ]; then
            git status --short --untracked-files=all -- drizzle
            echo "::error::Database schema changes require committed Drizzle migrations"
            exit 1
          fi

      - name: Build application
        run: pnpm build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These files are intentionally gitignored. Store their complete contents
      # as multiline GitHub Environment secrets in the production environment.
      - name: Materialize production configuration
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
        run: |
          test -n "$ENV_PRODUCTION" || {
            echo "::error::Missing production secret: ENV_PRODUCTION"
            exit 1
          }
          test -n "$WRANGLER_CONFIG" || {
            echo "::error::Missing production secret: WRANGLER_CONFIG"
            exit 1
          }
          printf '%s\n' "$ENV_PRODUCTION" > .env.production
          printf '%s\n' "$WRANGLER_CONFIG" > wrangler.jsonc

      # Compile with the exact production configuration before touching D1.
      # `cf:deploy` intentionally rebuilds before deployment as a final guard.
      - name: Verify production Worker build
        run: |
          set -a
          . ./.env.production
          set +a
          pnpm run cf:build

      - name: List pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler d1 migrations list DB
          --config wrangler.jsonc --remote

      - name: Capture D1 rollback bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler d1 time-travel info DB
          --config wrangler.jsonc --json > d1-rollback.json

      - name: Save D1 rollback bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-rollback-${{ github.sha }}-${{ github.run_attempt }}
          path: d1-rollback.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler d1 migrations apply DB
          --config wrangler.jsonc --remote

      - name: Deploy app Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run cf:deploy

      - name: Deploy runtime Worker and container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run runtime:deploy
